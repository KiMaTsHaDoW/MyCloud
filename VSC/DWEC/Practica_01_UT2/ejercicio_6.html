<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const numero_tres = 3;
        const condicion = 30;
        let multiplicacion = 1;
        for (indice = 1; indice <= condicion ; indice++){
            if (indice % numero_tres == 0){
                document.write(indice + ", ");
                multiplicacion *= indice;
            };
        };
        document.writeln("<br>Numero: " + multiplicacion);
    </script>
</body>
</html>

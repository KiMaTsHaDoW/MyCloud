<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var numero = 4; // 4 es un valor para que entre si o si al while
        while (numero != 0){
            numero = parseInt(prompt("Introduce un numero (0 finalizara el programa)"))
            document.write(numero + " ")
        }
    </script>
</body>
</html>

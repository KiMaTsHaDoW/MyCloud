    <script>
        let area = 0;
        let opcion = 0;
        document.writeln(`
        <ol>
            <li>Area del triangulo (b*h/2)</li>
            <li>Area del rectangulo (b*h)</li>
            <li>Area del circulo (Pi*r^2)</li>
            <li>Salir</li>
        </ol>
        `);
        while (opcion != 4){
            opcion = parseInt(prompt("Selecciona una opcion 1. Area triangulo 2. Area rectangulo 3. Area ciruclo 4. Salir"));
            if (opcion == 1){
                let altura = parseInt(prompt("Introduce la altura del triangulo (Numero Entero)"))
                let base = parseInt(prompt("Introduce la base del triangulo (Numero Entero)"))
                area = (altura * base) / 2

            }
            else if (opcion == 2){
                let altura = parseInt(prompt("Introduce la altura del rectangulo (Numero Entero)"))
                let base = parseInt(prompt("Introduce la base del rectangulo (Numero Entero)"))
                area = altura * base
            }
            else if (opcion == 3){
                let radio = parseInt(prompt("Introduce la altura del triangulo (Numero Entero)"))
                area = (Math.PI * radio**2)
            }
            else if (opcion == 4){
                alert("Adios")
            }
            else{
                alert("Elige algo valido, inepto")
            }
            console.log("El area de la figura seleccionada es " + area)
        }

    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Mayor de edad</h1>
    <p>
        <label for="edad">Escribe tu edad</label>
        <input type="number" id="edad"> 
    </p>
    <button onclick="comprobarEdad()">Comporbar</button>

    <p id="resultado"></p>


    <script>
        function comprobarEdad(){
            let edad = document.getElementById("edad").value;
            if (edad >= 18){
                document.getElementById("resultado").innerHTML = "Eres mayor de edad"
            }
            else{
                document.getElementById("resultado").innerHTML = "No eres mayor de edad"
            }
        }
    </script>
</body>
</html>

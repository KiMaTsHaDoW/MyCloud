    <!-- Ejercicio 3 -->

    <script>
        let numero_operar = parseInt(prompt("introduce un numero"));
        document.writeln("Valor exponencial: " + numero_operar.toExponential() + "<br>");
        document.writeln("Numero con 4 decimales: " + numero_operar.toFixed(4) + "<br>");
        document.writeln("Numero con binario: " + numero_operar.toString(2) + "<br>");
        document.writeln("Numero con octal: " + numero_operar.toString(8) + "<br>");
        document.writeln("Numero con hexadecimal: " + numero_operar.toString(16) + "<br>");
    </script>

    <!-- Ejercicio 7 -->

    <script>
        let suma = 0;
        let cadena = prompt("Introduce una cadena con numeros");
        function buscarDigitos(cadena){
            for (indice=0; indice < cadena.length; indice++){
            if (/\d/.test(cadena[indice])){
                suma += parseInt(cadena[indice]);
            }
        }
        return suma;
        }
        document.writeln(buscarDigitos(cadena))
    </script>

<body>

    <script>
        function cambiarColor(){

        setTimeout(cambiarColor, 3000);

        let contador = 0;
        let idIntervalo = setInterval(mostrarMensaje2, 1000);
        function mostrarMensaje2(){
            document.write("Mensaje cada segundo<br>");

            if (contador >= 5){
                clearInterval(idIntervalo);

        }

<html lang="en">

<body>
    <script>
        Math.abs(a) // Hace el valor absoluto del numero (quita el negativo)
        Math.acos(a) / Math.asin(a) / Math.atan(a) // Funciones de calculo trigonometrico
        Math.ceil(a) // Redondea el numero a su entero superior (4,1 = 5)
        Math.exp(a) // Exponencial
        Math.floor(a) // Redondea el numero a su entero inferior (4,9 = 4)
        Math.log(a) // Calculo de logaritmo
        Math.max(a,b) / Math.min(a,b) // Conseguir el maximo o el minimo de 2 numeros
        Math.pow(a,b) // Eleva A al numero B
        Math.random() // Genera un numero enter 0 y 1. MUTIPLICAR POR 100 PARA CONSEGUIR EL NUMERO (da valores 0.algo)
        Math.round(a) // Redondea el numero a su entero mas proximo (el que se suele usar)
        Math.sqrt(a) // Raiz cuadrada del numero
        Math.trunc(a) // Trunca los decimales
        Math.sign(a) // Devuelve el signo (1 en positivo, -1 en negativo, 0 si es 0)

        Math.random * (max-min) + min // Random en un intervalo
        Math.floor(Math.random() * 10) // Random de 0 a 9
        Math.floor(Math.random() * 10 + 1) // Random de 1 a 10


    </script>
</body>

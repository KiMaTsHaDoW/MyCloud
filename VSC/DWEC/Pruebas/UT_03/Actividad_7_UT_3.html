    <!-- Ejercicio 6 -->

    <label>Columnas: <input type="number" id="cols"></label>
    <label>Filas: <input type="number" id="rows"></label>
    <button onclick="crearTabla()">Crear tabla</button>

    <div id="main_frame">

    </div>

    <script>
        function crearTabla(){
            let div = document.getElementById('main_frame');
            let cols = document.getElementById('cols').value;
            let rows = document.getElementById('rows').value;
            let table = document.createElement('table');

            for (let index = 0; index < cols; index++) {
                let fila = document.createElement('tr');
                table.appendChild(fila);
                for (let index = 0; index < rows; index++) {
                    let columna = document.createElement('td')
                    columna.textContent = 'a';
                    table.appendChild(columna);
                }
                
            }
        }
    </script>

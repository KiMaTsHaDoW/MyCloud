<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Cookies</h2>
    <button onclick="guardarCookie()">Guardar Cookie</button>

    <script>
        function guardarCookie(){
            const mensaje = "Cookie: Hola";
            document.cookie=`mensaje=${mensaje}; expires=01 Jan 2099`;
        }
    </script>
</body>
</html>

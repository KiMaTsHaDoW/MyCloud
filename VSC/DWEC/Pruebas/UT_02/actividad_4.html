    <script>
        const letras = ["T", "R", "W", "A", "G", "M", "Y", "F", "P", "D",
                        "X", "B", "N", "J", "Z", "S", "Q", "V", "H", "L", "C", "K", "E"]
        let resto;
        let num_dni = prompt("Introduce los 8 digitos del dni");
        if (0 < num_dni < 99999999){
            resto = parseInt(num_dni) % 23;
        }
        document.write("La letra del DNI " + num_dni + " es " + letras[resto]);

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="calculadora">
    <div id="pantalla" class="pantalla">0</div>
    <div class="botones">
      <button onclick="agregar('7')">7</button>
      <button onclick="agregar('8')">8</button>
      <button onclick="agregar('9')">9</button>
      <button class="operador" onclick="agregar('/')">÷</button>

      <button onclick="agregar('4')">4</button>
      <button onclick="agregar('5')">5</button>
      <button onclick="agregar('6')">6</button>
      <button class="operador" onclick="agregar('*')">x</button>

      <button onclick="agregar('1')">1</button>
      <button onclick="agregar('2')">2</button>
      <button onclick="agregar('3')">3</button>
      <button class="operador" onclick="agregar('-')">-</button>

      <button class="cero" onclick="agregar('0')">0</button>
      <button onclick="agregar('.')">.</button>
      <button class="operador" onclick="agregar('+')">+</button>

      <button class="funcion" onclick="agregar('Math.sin(')">sen</button>
      <button class="funcion" onclick="agregar('Math.cos(')">cos</button> 
      <button class="funcion" onclick="agregar('Math.tan(')">tan</button>
      <button onclick="agregar(')')">)</button>

      <button class="funcion" onclick="agregar('Math.log10(')">log</button>
      <button class="funcion" onclick="agregar('Math.log(')">ln</button>
      <button class="funcion" onclick="agregar('Math.sqrt(')">√</button>
      <button class="funcion" onclick="agregar('Math.exp(')">exp</button>

      <!-- En todas las funciones avanzadas de la libreria Math, se agregan sin cerrar el parentesis
     para que el usuario pueda introducir valores dentro de la funcion -->

      <button class="borrar" onclick="borrar()">C</button>
      <button class="igual" onclick="calcular()">=</button>
      <button class="funcion" onclick="agregar('**')">x^y</button>
    </div>
  </div>
  <script src="functions.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:nth-child(odd){
            background-color: red;
        }
        li:nth-child(even){
            background-color: yellow;
        }
    </style>
</head>
<body>
    <ul>
        <li>VIVA</li>
        <li></li>
        <li>ESPAÑA</li>
    </ul>
</body>
</html>

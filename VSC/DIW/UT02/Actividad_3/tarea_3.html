<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            font-size: 25px;
        }
        h2{
            font-size: 45px;
        }
        .p1{
            color: blue;
            font-size: 0.5in;
        }
        .p2{
            color: brown;
            font-size: 25px;
        }
        .p3{
            font-size: 2em;
        }
        .p4{
            font-size: 1.5rem;
        }
        .boton{
            padding: 10px 20px 10px 20px;
            font-size: 0.7rem;
            color: aliceblue;
            background-color: blue;
            border-radius: 5px;

        }
    </style>
</head>
<body>
    <div>
        <h2>Pruebas de font size</h2>
        <p class="p1">Parrafo que usa "in"</p>
        <p class="p2">Parrafo que usa "px"</p>
        <p class="p3">Parrafo que usa "em"</p>
        <p class="p4">Parrafo que usa "rem"</p>
        <button class="boton">Boton</button>
    </div>
</body>
</html>
